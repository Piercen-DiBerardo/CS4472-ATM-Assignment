name: CI

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened, labeled, unlabeled]
    push:
        branches: [dev]

permissions:
    contents: read
    checks: write
    pull-requests: write

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: 11
                cache: maven
            - name: Checkstyle
              run: mvn -B checkstyle:check
    
    tests:
        name: Tests
        runs-on: ubuntu-latest
        steps:

          - name: Check PR label
            if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'phase:tests') == contains(github.event.pull_request.labels.*.name, 'phase:fix')
            run: |
                echo "::error::PR must have only one label"
                exit 1

          - uses: actions/checkout@v5
          - uses: actions/setup-java@v5
            with:
                distribution: 'temurin'
                java-version: 11
                cache: maven
            
          - name: Run phase tests
            if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'phase:tests')
            run: mvn -B -Dmaven.test.failure.ignore=true test

          - name: Run fix tests
            if: contains(github.event.pull_request.labels.*.name, 'phase:fix')
            run: mvn -B test

          - name: Publish Junit results
            if: always()
            continue-on-error: true
            uses: EnricoMi/publish-unit-test-result-action@v2
            with: 
                files: target/surefire-reports/*.xml

          - name: Coverage report
            if: github.event_name == 'pull_request'
            continue-on-error: true
            uses: madrapps/jacoco-report@v1.7.1
            with:
                paths: target/site/jacoco/jacoco.xml
                token: ${{ secrets.GITHUB_TOKEN }}
                    
            

                

           